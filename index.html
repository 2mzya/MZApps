<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MZApps</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f7f7f2;
      --card: #fff;
      --ink: #171717;
      --muted: #7d7d75;
      --line: #e5e5dc;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(640px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 48px;
    }
    .eyebrow {
      display: block;
      text-align: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    h1 {
      text-align: center;
      margin: 0 0 36px;
      font-size: 34px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -1.4px;
    }
    #apps { display: flex; flex-direction: column; gap: 12px; }
    .app {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .app:hover {
      transform: translateY(-2px);
      border-color: #cfcfc4;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .app-num {
      flex: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .app-text { flex: 1; min-width: 0; }
    .app-name {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .app-path {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .app-arrow {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 15px;
      transition: background .18s ease, color .18s ease;
    }
    .app:hover .app-arrow { background: var(--ink); color: #fff; border-color: var(--ink); }
    #status { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
    footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--ink); font-weight: 600; text-decoration: none; }
    footer a:hover { opacity: .6; }
    @media (max-width: 520px) {
      main { padding-top: 48px; }
      h1 { font-size: 26px; margin-bottom: 28px; }
      .app { padding: 15px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Apps · Downloads · Updates</span>
    <h1>MZApps : Download and update</h1>
    <div id="status">Loading...</div>
    <section id="apps" aria-label="Applications"></section>
    <footer><a href="https://2mzya.github.io/">By Mohamad Z</a></footer>
  </main>

  <script>
    const OWNER = "2mzya";
    const REPO = "MZApps";
    const status = document.getElementById("status");
    const apps = document.getElementById("apps");

    async function loadApps() {
      try {
        const repoResponse = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`);
        if (!repoResponse.ok) throw new Error("Unable to load applications.");
        const repo = await repoResponse.json();
        const branch = repo.default_branch || "main";

        const treeResponse = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(branch)}?recursive=1`
        );
        if (!treeResponse.ok) throw new Error("Unable to load repository files.");
        const tree = await treeResponse.json();

        const files = (tree.tree || [])
          .filter(file =>
            file.type === "blob" &&
            file.path.toLowerCase() !== "index.html" &&
            !file.path.startsWith(".github/")
          )
          .sort((a, b) => a.path.localeCompare(b.path));

        status.textContent = "";

        if (!files.length) {
          status.textContent = "No applications available.";
          return;
        }

        let index = 0;
        for (const file of files) {
          const link = document.createElement("a");
          link.className = "app";

          const encodedPath = file.path.split("/").map(encodeURIComponent).join("/");
          link.href = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(branch)}/${encodedPath}`;
          link.setAttribute("download", file.path.split("/").pop());
          link.title = `Download ${file.path}`;

          const num = document.createElement("span");
          num.className = "app-num";
          num.textContent = String(++index).padStart(2, "0");

          const text = document.createElement("span");
          text.className = "app-text";

          const name = document.createElement("span");
          name.className = "app-name";
          name.textContent = file.path.split("/").pop();

          const path = document.createElement("span");
          path.className = "app-path";
          path.textContent = file.path;

          const arrow = document.createElement("span");
          arrow.className = "app-arrow";
          arrow.textContent = "↓";

          text.append(name, path);
          link.append(num, text, arrow);
          apps.appendChild(link);
        }
      } catch (error) {
        status.textContent = error.message || "Unable to load applications.";
      }
    }

    loadApps();
  </script>
</body>
</html>
